[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-structure-resolver"
version = "0.3.0"
description = "Resolve an exact protein sequence to an experimental or predicted structure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
]

[project.scripts]
protein-structure-resolver = "protein_structure_resolver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
